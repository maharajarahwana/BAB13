  <!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bab13</title>

<style>

*{
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  background:#f4f4f4;
  margin:0;
  padding:15px;
}

.card{
  background:white;
  width:100%;
  max-width:500px;
  margin:auto;
  padding:25px 20px;
  text-align:center;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}

#question{
  font-size:42px;
  margin-bottom:10px;
}

input{
  width:100%;
  padding:12px;
  font-size:16px;
  margin-top:10px;
  border:2px solid orange;
  border-radius:6px;
  outline:none;
}

button{
  width:100%;
  padding:12px;
  font-size:16px;
  margin-top:15px;
  cursor:pointer;
  background:#007BFF;
  color:white;
  border:none;
  border-radius:6px;
}

.result{
  font-size:20px;
  font-weight:bold;
}

.correct{
  color:green;
}

.wrong{
  color:red;
}

/* Perbaikan agar nomor tidak terpotong */

ol{
  text-align:left;
  max-height:65vh;
  overflow-y:auto;
  padding-left:30px;
  margin:0;
}

li{
  margin-bottom:8px;
  line-height:1.4;
}

</style>
</head>

<body>

<div class="card">

<h2 id="question"></h2>

<input type="text" id="answerInput" placeholder="Tulis jawaban di sini">

<button id="nextBtn">Selanjutnya</button>

</div>

<script>

let questions = [

{ soal: "주말 활동", jawaban: "aktifitas akhir pekan" },
{ soal: "피시방 / PC 방", jawaban: "warnet" },
{ soal: "추구하다", jawaban: "bermain sepak bola" },
{ soal: "불교", jawaban: "Budha" },
{ soal: "기분이 좋다", jawaban: "perasaannya bagus" },
{ soal: "게임을 하다", jawaban: "bermain game" },
{ soal: "기쁘다", jawaban: "gembira" },
{ soal: "천주교", jawaban: "Katholik" },
{ soal: "슬프다", jawaban: "sedih" },
{ soal: "이슬람 교", jawaban: "agama Islam" },
{ soal: "헬스를 하다", jawaban: "melakukan gym" },
{ soal: "노래방", jawaban: "karaoke" },
{ soal: "탁구를 하다", jawaban: "bermain tenis meja" },
{ soal: "노래를 부르다", jawaban: "bernyanyi" },
{ soal: "교회", jawaban: "gereja" },
{ soal: "운동장", jawaban: "lapangan olahraga" },
{ soal: "절", jawaban: "kuil" },
{ soal: "기분", jawaban: "perasaan" },
{ soal: "사원", jawaban: "masjid" },
{ soal: "시간이 있다", jawaban: "ada waktu" },
{ soal: "기도를 하다", jawaban: "berdoa" },
{ soal: "시간이 없다", jawaban: "tidak ada waktu" },
{ soal: "예불을 드리다", jawaban: "melakukan ibadah Budha" },
{ soal: "일이 많다", jawaban: "pekerjaannya banyak" },
{ soal: "피곤하다", jawaban: "lelah" },
{ soal: "일이 적다", jawaban: "sedikit pekerjaan" },
{ soal: "심심하다", jawaban: "bosan" },
{ soal: "한가하다", jawaban: "senggang" },
{ soal: "술", jawaban: "alkohol" },
{ soal: "신자", jawaban: "pemeluk" },
{ soal: "돼지 고기", jawaban: "daging babi" },
{ soal: "신앙 생활", jawaban: "kehidupan beragama" },
{ soal: "여론 속의", jawaban: "pendapat publik" },
{ soal: "성당", jawaban: "gereja Katholik" },
{ soal: "고향 사람", jawaban: "orang kampung halaman" },
{ soal: "미사를 드리다", jawaban: "ibadah Missa" },
{ soal: "친구", jawaban: "teman" },
{ soal: "예수님", jawaban: "Yesus" },
{ soal: "방문하다", jawaban: "berkunjung" },
{ soal: "탄생일", jawaban: "hari kelahiran" },
{ soal: "개신교", jawaban: "Protestan" },
{ soal: "공휴일", jawaban: "hari libur nasional" },
{ soal: "믿다", jawaban: "percaya" },
{ soal: "지정 되다", jawaban: "ditentukan" },

];

questions = questions.sort(()=>Math.random()-0.5);

let index = 0;
let score = 0;
let userAnswers = [];

const questionEl = document.getElementById("question");
const answerInput = document.getElementById("answerInput");
const nextBtn = document.getElementById("nextBtn");
const card = document.querySelector(".card");

function showQuestion(){
  questionEl.textContent = questions[index].soal;
  answerInput.value="";
  answerInput.focus();
}

nextBtn.addEventListener("click",()=>{

  const userAnswer = answerInput.value.trim().toLowerCase();

  userAnswers[index] = userAnswer;

  if(userAnswer === questions[index].jawaban){
    score++;
  }

  index++;

  if(index < questions.length){
    showQuestion();
  }else{
    showResult();
  }

});

function showResult(){

  let answerList="";

  questions.forEach((q,i)=>{

    if(userAnswers[i] === q.jawaban){
      answerList += `<li>${q.soal} = <span class="correct">${q.jawaban}</span></li>`;
    }else{
      answerList += `<li>${q.soal} = <span class="correct">${q.jawaban}</span><br>
      Jawaban kamu: <span class="wrong">${userAnswers[i] || "(kosong)"}</span></li>`;
    }

  });

  card.innerHTML = `
  <hr>
  <p>Kunci Jawaban:</p>
  <ol>${answerList}</ol>
  `;

}

showQuestion();

</script>

</body>
</html>
